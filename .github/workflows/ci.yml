name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:search-path

  # Test tiền ở tầng SQL (bán hàng + nhập kho) chạy trên Supabase STAGING bằng RPC thật. Cần 2 secrets
  # STAGING_SUPABASE_URL + STAGING_SUPABASE_SECRET (kèm đã áp scripts/staging-*-schema.sql lên staging);
  # thiếu secret → bỏ qua kèm cảnh báo (PR từ fork không có secret). Có secret thì fail = chặn deploy-migrations.
  # concurrency: 2 lần chạy cùng lúc trên 1 DB staging sẽ xoá fixture của nhau.
  test-sql:
    needs: check
    runs-on: ubuntu-latest
    concurrency: staging-sql-tests
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SECRET: ${{ secrets.STAGING_SUPABASE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Test tiền bán hàng (bulk_create_orders)
        if: env.STAGING_SUPABASE_URL != ''
        run: npm run test:money
      - name: Test tiền nhập kho (WAC, cash_phase, owing)
        if: env.STAGING_SUPABASE_URL != ''
        run: npm run test:inventory
      - name: Bỏ qua test SQL (thiếu secrets staging)
        if: env.STAGING_SUPABASE_URL == ''
        run: echo "::warning::Bỏ qua test:money / test:inventory — chưa cấu hình STAGING_SUPABASE_URL / STAGING_SUPABASE_SECRET"

  deploy-functions:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # CLI mới hỏi xác nhận trước khi deploy; runner không có terminal nên phải --yes. --project-ref đã deprecated → --remote=<ref>.
      - run: |
          supabase functions deploy create-team-member --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy set-staff-password --remote="$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy sepay-webhook --no-verify-jwt --remote="$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # DB migrations chạm schema production đang phục vụ merchant sống — chạy trong
  # GitHub Environment "production" nên cần cấu hình required reviewer (Settings →
  # Environments → production) để có 1 bước approve thủ công trước khi push.
  deploy-migrations:
    needs: [check, test-sql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # CLI mới mặc định đẩy lên local stack (127.0.0.1:54322) → ECONNREFUSED trên runner; --remote = project đã link ở bước trên.
      - run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
